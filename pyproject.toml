[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-network-analyzer"
version = "1.0.0"
description = "Privacy-aware LinkedIn connections export analysis with explainable recommendations and deterministic priority scoring."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Alireza Belal"}
]
dependencies = [
  "pandas>=2.0,<3.0",
  "openpyxl>=3.1,<4.0",
  "matplotlib>=3.7,<4.0",
  "seaborn>=0.13,<1.0"
]

[project.scripts]
linkedin-network-analyzer = "scripts.main:main"

[tool.setuptools.packages.find]
include = ["scripts*"]
