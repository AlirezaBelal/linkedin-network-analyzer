name: CI

on:
  push:
    branches: [master, productize-network-analyzer]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      MPLBACKEND: Agg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip check

      - name: Compile source
        run: python -m compileall -q scripts

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run synthetic CLI smoke test
        run: |
          linkedin-network-analyzer --input examples/Connections.example.csv --output-dir .ci-output --step all
          test -f .ci-output/all_connections_categorized.csv
          test -f .ci-output/final_linkedin_actions.xlsx
          test -f .ci-output/linkedin_priority.xlsx
          test -f .ci-output/reports/category_distribution_pie.png
          test -f .ci-output/priority_reports/priority_score_boxplot.png

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Audit runtime dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install -e .
          python -m pip_audit
