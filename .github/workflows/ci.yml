name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      MPLBACKEND: Agg
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip check

      - name: Compile source
        run: python -m compileall -q scripts

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run synthetic CLI smoke test
        run: |
          linkedin-network-analyzer --input examples/Connections.example.csv --output-dir .ci-output --step all
          test -f .ci-output/all_connections_categorized.csv
          test -f .ci-output/final_linkedin_actions.xlsx
          test -f .ci-output/linkedin_priority.xlsx
          test -f .ci-output/reports/category_distribution_pie.png
          test -f .ci-output/priority_reports/priority_score_boxplot.png

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Audit CLI runtime dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install -e .
          python -m pip_audit

      - name: Validate static-only demo has no runtime requirements
        run: |
          test ! -e hf-space/app.py
          test ! -e hf-space/requirements.txt
          test -f hf-space/index.html

  quality:
    name: Static checks and coverage
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install quality tools
        run: |
          python -m pip install -e . coverage ruff
      - name: Basic static checks
        run: ruff check --select E9,F63,F7,F82 scripts tests
      - name: Enforce measured code coverage
        run: |
          coverage run --source=scripts -m unittest discover -s tests -v
          coverage report --show-missing --fail-under=70

  privacy:
    name: Tracked-data and hosted-demo safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Reject tracked private datasets and old remover
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git ls-files '*.csv' '*.xlsx' '*.xls' '*.jsonl' '*.vcf' '*.env' | grep -v '^examples/Connections\.example\.csv$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected tracked contact or environment data file"
            exit 1
          fi
          test ! -f linkedin_remove_connections.py
          test ! -e hf-space/app.py
          test ! -e hf-space/requirements.txt
          test -f hf-space/index.html
          grep -qx 'sdk: static' hf-space/README.md
